<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Capa Facebook - Passageiro100Milhas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1640px;
      height: 624px;
      overflow: hidden;
      position: relative;
      background: #F4F7FB;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #003A80;
    }

    /* Sutil luminescência azul-céu no quadrante superior esquerdo */
    .sky-wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 680px 420px at 26% 12%, rgba(0, 102, 204, 0.06) 0%, rgba(244, 247, 251, 0) 70%),
        linear-gradient(125deg, #F8FAFD 0%, #F4F7FB 58%, #EBF2FA 100%);
      z-index: 1;
    }

    /* Herói fotográfico luminoso na metade direita com máscara alfa contínua (sem emenda visível) */
    .photo-stage {
      position: absolute;
      top: 0;
      right: 0;
      width: 1000px;
      height: 624px;
      z-index: 2;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(
        90deg,
        transparent 0%,
        transparent 14%,
        rgba(0, 0, 0, 0.25) 26%,
        rgba(0, 0, 0, 0.78) 44%,
        #000000 66%
      );
      mask-image: linear-gradient(
        90deg,
        transparent 0%,
        transparent 14%,
        rgba(0, 0, 0, 0.25) 26%,
        rgba(0, 0, 0, 0.78) 44%,
        #000000 66%
      );
    }

    .photo-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 41%;
      filter: brightness(1.11) contrast(1.02) saturate(1.10);
      transform: scale(1.02);
    }

    /* Brilho solar sutil superior direito para sensação diurna limpa */
    .sunlight-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 82% 28%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 64%);
      z-index: 4;
    }

    /* Trajetória aérea vetorial sutil conectando a marca à janela */
    .flight-arc {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* Bloco editorial dentro da zona segura universal (x >= 280px, y: 52..536px) */
    .content-safe {
      position: absolute;
      left: 280px;
      top: 52px;
      bottom: 72px;
      width: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      z-index: 10;
    }

    .brand-logo {
      width: 286px;
      height: auto;
      display: block;
      margin-bottom: 24px;
    }

    .accent-rule {
      width: 52px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, #F57C00 0%, #FFA726 100%);
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 46px;
      font-weight: 800;
      line-height: 1.09;
      letter-spacing: -0.025em;
      color: #003A80;
      margin-bottom: 18px;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.48;
      color: #334155;
      max-width: 530px;
    }

    .subtitle strong {
      color: #E66B00;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="sky-wash"></div>

  <div class="photo-stage">
    <img src="../../templates/assets/bg_02.jpg" alt="Vista da asa do avião acima das nuvens em dia claro">
    <div class="sunlight-tint"></div>
  </div>

  <svg class="flight-arc" viewBox="0 0 1640 624" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="arcGrad" x1="650" y1="130" x2="1150" y2="134" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0066CC" stop-opacity="0.06"/>
        <stop offset="55%" stop-color="#0066CC" stop-opacity="0.34"/>
        <stop offset="100%" stop-color="#F57C00" stop-opacity="0.58"/>
      </linearGradient>
    </defs>
    <path
      d="M 650 132 Q 905 42 1150 134"
      stroke="url(#arcGrad)"
      stroke-width="2"
      stroke-dasharray="6 8"
      stroke-linecap="round"
    />
    <circle cx="1150" cy="134" r="4.5" fill="#F57C00" fill-opacity="0.72" />
    <circle cx="1150" cy="134" r="10" stroke="#F57C00" stroke-opacity="0.25" stroke-width="2" />
  </svg>

  <main class="content-safe">
    <img
      class="brand-logo"
      src="../logo/logo-passageiro100milhas-hd-transparent.png"
      alt="Passageiro 100 Milhas"
    >
    <div class="accent-rule"></div>
    <h1>Emissões reais com milhas e transferências bonificadas.</h1>
    <p class="subtitle">
      Alertas diários com cálculo de custo real para você <strong>viajar mais pagando menos</strong>.
    </p>
  </main>
</body>
</html>
