name: Build e Deploy para Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push e Deploy Automático
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Autenticar no Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpassageiro100milhas.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 4. Extrair Metadados e Tags Automáticas (Docker)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crpassageiro100milhas.azurecr.io/passageiro100milhas-bot
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 5. Compilar e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Autenticar no Azure via OIDC (Identidade Gerenciada)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 7. Atualizar Revisão no Azure Container Apps
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_TAG=$(echo "$ALL_TAGS" | head -n 1)
          echo "Fazendo deploy no Azure Container Apps com a imagem: $IMAGE_TAG"
          az containerapp update \
            --name app-passageiro100milhas \
            --resource-group rg-passageiro100milhas-mx \
            --image "$IMAGE_TAG"
